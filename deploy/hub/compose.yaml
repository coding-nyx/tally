name: tally
services:
  gateway:
    image: caddy:2
    restart: unless-stopped
    network_mode: host
    read_only: true
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    tmpfs:
      - /data:size=16m,nosuid
      - /config:size=16m,nosuid
      - /tmp:size=16m,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # The official Caddy binary carries this file capability; its bounding set
    # must retain it even though our listener uses an unprivileged port.
    cap_add:
      - NET_BIND_SERVICE
    mem_limit: 128m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
  finance:
    build:
      context: ../..
      dockerfile: deploy/hub/Dockerfile
    image: tally-hub:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 768m
    cpus: 1.5
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3001
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/finance/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
